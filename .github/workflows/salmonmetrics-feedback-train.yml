name: SalmonMetrics feedback training

on:
  workflow_dispatch:
  schedule:
    - cron: "23 18 * * *"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    if: ${{ secrets.WEAPON_FEEDBACK_EXPORT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r salmonmetrics_detector/requirements-train.txt

      - name: Import feedback, retrain, and verify
        env:
          WEAPON_FEEDBACK_EXPORT_TOKEN: ${{ secrets.WEAPON_FEEDBACK_EXPORT_TOKEN }}
        run: |
          python salmonmetrics_detector/tools/retrain_from_feedback.py \
            --epochs 8 \
            --samples 14000 \
            --batch-size 192 \
            --threads 4 \
            --real-fraction 0.76 \
            --unknown-fraction 0.12

      - name: Commit updated classifier artifacts
        run: |
          if [ -z "$(git status --porcelain -- salmonmetrics_detector)" ]; then
            echo "No detector training changes to commit."
            exit 0
          fi
          git config user.name "salmonmetrics-feedback-trainer"
          git config user.email "actions@users.noreply.github.com"
          git add salmonmetrics_detector/assets/models \
            salmonmetrics_detector/assets/training/real_weapon_crops \
            salmonmetrics_detector/assets/training/feedback_imports
          if git diff --cached --quiet; then
            echo "No staged detector training changes to commit."
            exit 0
          fi
          git commit -m "Train weapon classifier from user feedback"
          git push origin HEAD:dev
